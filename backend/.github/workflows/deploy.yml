name: Deploy GaonWala to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_BUILDKIT: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gaonwala-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gaonwala-frontend:latest .

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/gaonwala-backend:latest

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/gaonwala-frontend:latest

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=5000
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          EOF

      - name: Pull and deploy containers
        run: |
          docker compose pull
          docker compose up -d --force-recreate

      - name: Clean up
        run: docker image prune -f