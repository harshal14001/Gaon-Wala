name: Deploy GaonWala to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Docker username
        env:
          RAW_USER: ${{ secrets.DOCKER_USERNAME }}
        run: echo "DOCKER_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build backend image
        run: docker build -t "$DOCKER_USER/gaonwala-backend:latest" ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_MEASUREMENT_ID="${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" \
            -t "$DOCKER_USER/gaonwala-frontend:latest" .

      - name: Push images
        run: |
          docker push "$DOCKER_USER/gaonwala-backend:latest"
          docker push "$DOCKER_USER/gaonwala-frontend:latest"

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=5000
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM=${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_SMS_FROM=${{ secrets.TWILIO_SMS_FROM }}
          EOF

      - name: Deploy containers
        run: |
          docker compose pull
          docker compose up -d --force-recreate

      - name: Clean up
        run: docker image prune -f