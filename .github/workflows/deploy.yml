name: Deploy GaonWala to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Docker username
        env:
          RAW_USER: ${{ secrets.DOCKER_USERNAME }}
        run: echo "DOCKER_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build backend image
        run: docker build -t "$DOCKER_USER/gaonwala-backend:latest" ./backend

      - name: Build frontend image
        run: docker build -t "$DOCKER_USER/gaonwala-frontend:latest" .

      - name: Push images
        run: |
          docker push "$DOCKER_USER/gaonwala-backend:latest"
          docker push "$DOCKER_USER/gaonwala-frontend:latest"

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=5000
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          EOF

      - name: Deploy containers
        run: |
          docker compose pull
          docker compose up -d --force-recreate

      - name: Clean up
        run: docker image prune -f
